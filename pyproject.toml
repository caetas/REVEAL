[project]
name = "reveal"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.11.0",
    "diffusers>=0.36.0",
    "dotenv>=0.9.9",
    "einops>=0.8.1",
    "fsspec>=2025.9.0",
    "lightning>=2.5.6",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
    "pytorch-fid>=0.3.0",
    "s3fs>=2025.9.0",
    "tcl>=0.2",
    "termcolor>=3.3.0",
    "timm>=1.0.21",
    "toml>=0.10.2",
    "torch>=2.9.0",
    "torchdiffeq>=0.2.5",
    "torchvision>=0.24.0",
    "transformers>=4.57.1",
    "triton>=3.5.1; sys_platform == 'linux'",
    "wandb>=0.22.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
